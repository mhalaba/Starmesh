# Router advertisements for a bypass mini-PC.
# Replace the prefix with the /64 you delegate to the LAN from the
# Starlink /56. radvd must keep speaking or phones lose global IPv6.

interface wlan0 {
  AdvSendAdvert on;
  MinRtrAdvInterval 3;
  MaxRtrAdvInterval 10;
  prefix 2a0d:3344:xxxx:1::/64 {
    AdvOnLink on;
    AdvAutonomous on;
    AdvValidLifetime 1800;
    AdvPreferredLifetime 600;
  };
};
